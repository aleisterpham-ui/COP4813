<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Assignment 3 HTML5 form for Aleister Pham's COP4813 Web Systems I coursework.">

    <title>Assignment 3 - Form | Aleister Pham</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Assignment 3 - Contact Form</h1>
        <p>COP4813 - Web Systems I</p>
    </header>

<nav id="site-nav" aria-label="Main navigation"></nav>

    <main>

        <section>

            <h2>Contact Information</h2>

            <p>
                Please complete all fields below. Your information will be
                validated before you continue to the confirmation page.
            </p>

            <form id="contactForm"
                  action="mailto:aleister_pham@daytonastate.edu"
                  method="post"
                  enctype="text/plain">

                <fieldset>

                    <legend>Name</legend>

                    <label for="firstName">First Name</label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        autocomplete="given-name"
                        required>

                    <label for="lastName">Last Name</label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        autocomplete="family-name"
                        required>

                </fieldset>


                <fieldset>

                    <legend>Mailing Address</legend>

                    <label for="address">Street Address</label>

<input
    type="text"
    id="address"
    name="address"
    autocomplete="address-line1"
    required>


                    <label for="city">City</label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        autocomplete="address-level2"
                        required>


                    <label for="state">State</label>

                    <input
                        type="text"
                        id="state"
                        name="state"
                        maxlength="2"
                        placeholder="FL"
                        autocomplete="address-level1"
                        required>


                    <label for="zip">ZIP Code</label>

                    <input
                        type="text"
                        id="zip"
                        name="zip"
                        inputmode="numeric"
                        pattern="[0-9]{5}(-[0-9]{4})?"
                        placeholder="32708"
                        autocomplete="postal-code"
                        required>

                </fieldset>


                <fieldset>

                    <legend>Contact Details</legend>

                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="(407)555-1234"
                        pattern="\([0-9]{3}\)[0-9]{3}-[0-9]{4}"
                        autocomplete="tel"
                        required>


                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required>


                    <label for="birthdate">Birth Date</label>

                    <input
                        type="date"
                        id="birthdate"
                        name="birthdate"
                        autocomplete="bday"
                        required>

                </fieldset>


                <fieldset>

                    <legend>Message</legend>

                    <label for="message">Your Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        maxlength="1000"
                        required></textarea>

                </fieldset>


                <fieldset>

                    <legend>Confirmation</legend>

                    <label for="confirm">
                        Security Question: What is 3 + 4?
                    </label>

                    <input
                        type="number"
                        id="confirm"
                        name="confirm"
                        min="0"
                        max="20"
                        required>

                </fieldset>


                <button type="submit">
                    Review Information
                </button>

                <button type="reset">
                    Clear Form
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>Created by Aleister Viencent Pham</p>
    </footer>


    <script src="js/form.js"></script>

    <script src="js/nav.js"></script>

</body>

</html>
